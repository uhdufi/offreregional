
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101b36">

<title>تم التسجيل بنجاح | Offre Regional</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Tajawal:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
* {
box-sizing:border-box;
}

body {
margin:0;
min-height:100vh;
display:grid;
place-items:center;
padding:22px;
background:
radial-gradient(circle at 15% 10%,#4268f54a,transparent 30%),
linear-gradient(135deg,#101b36,#1b3155);
font-family:"Tajawal",sans-serif;
color:#15213b;
}

.card {
width:min(100%,520px);
background:#fff;
border-radius:28px;
padding:42px 35px;
text-align:center;
box-shadow:0 30px 90px #050c1c70;
}

.check {
width:82px;
height:82px;
margin:0 auto 22px;
border-radius:26px;
background:#e8fbf5;
color:#0b9c70;
display:grid;
place-items:center;
font-size:42px;
font-weight:900;
}

.brand {
font:800 16px "DM Sans";
direction:ltr;
color:#172747;
letter-spacing:.5px;
}

.brand span {
color:#4268f5;
}

.card h1 {
font-size:32px;
margin:25px 0 10px;
color:#101b36;
}

.card p {
color:#68748b;
line-height:1.9;
margin:0;
}

.details {
margin:25px 0;
padding:17px;
border:1px solid #e6eaf2;
border-radius:15px;
background:#f8faff;
text-align:right;
line-height:2;
font-size:14px;
}

.details b {
color:#172747;
}

.count {
font:800 46px "DM Sans";
color:#4268f5;
margin:8px 0 0;
}

.small {
font-size:12px;
color:#8792a7;
margin-top:0!important;
}

.btn {
display:inline-flex;
justify-content:center;
align-items:center;
width:100%;
padding:15px;
border:0;
border-radius:13px;
background:linear-gradient(135deg,#6380ff,#4268f5);
color:#fff;
font:800 15px "Tajawal";
margin-top:18px;
cursor:pointer;
}

.fallback {
display:block;
color:#4268f5;
font-size:12px;
margin-top:13px;
}

@media(max-width:480px) {
.card {
padding:32px 22px;
}

.card h1 {
font-size:27px;
}
}
</style>
</head>

<body>

<main class="card">

<div class="brand">
OFFRE <span>REGIONAL</span>
</div>

<div class="check">✓</div>

<h1>مبروك! توصلنا بطلب التسجيل</h1>

<p>
شكراً على ثقتك في Offre Regional.
بقيت خطوة صغيرة لتأكيد طلبك عبر واتساب.
</p>

<div class="details" id="registrationDetails">
جاري تحميل معلومات التسجيل…
</div>

<p>سيتم توجيهك إلى واتساب بعد</p>

<div class="count" id="countdown">10</div>

<p class="small">
ثوانٍ… يمكنك الضغط على الزر للانتقال مباشرة.
</p>

<button class="btn" id="whatsappButton" type="button">
تأكيد الطلب عبر واتساب ↗
</button>

<a class="fallback" href="index.html">
العودة إلى الموقع
</a>

</main>

<script>

// ضع نفس رقم واتساب الموجود في index.html
const WHATSAPP_NUMBER = "2126XXXXXXXX";

const data = JSON.parse(
sessionStorage.getItem("offreRegionalRegistration") || "null"
);

const details = document.getElementById("registrationDetails");

if (data) {

details.innerHTML =
"<b>الاسم:</b> " + escapeHTML(data.name) +
"<br><b>الهاتف:</b> " + escapeHTML(data.phone) +
"<br><b>الشعبة:</b> " + escapeHTML(data.branch) +
"<br><b>المستوى:</b> الأولى باك" +
"<br><b>العرض:</b> 499 DH";

} else {

details.textContent =
"لم نعثر على تفاصيل التسجيل. يمكنك العودة إلى الموقع وإعادة ملء الاستمارة.";

}

// حماية البيانات عند عرضها داخل الصفحة
function escapeHTML(value) {

return String(value).replace(/[&<>"']/g, function(char) {

return ({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
})[char];

});

}

// فتح واتساب برسالة التسجيل
function goToWhatsApp() {

if (!data) {
window.location.href = "index.html#register";
return;
}

if (!/^212\d{9}$/.test(WHATSAPP_NUMBER)) {
alert("يرجى إعداد رقم واتساب الصحيح داخل كود الموقع أولاً.");
return;
}

const message = [
"السلام عليكم، أود تأكيد طلبي في عرض Offre Regional.",
"الاسم: " + data.name,
"رقم الهاتف: " + data.phone,
"الشعبة: " + data.branch,
"المستوى: الأولى باك",
"العرض: 499 DH"
].join("\n");

window.location.href =
"https://wa.me/" +
WHATSAPP_NUMBER +
"?text=" +
encodeURIComponent(message);

}

// زر الانتقال المباشر
document.getElementById("whatsappButton")
.addEventListener("click", goToWhatsApp);

// العد التنازلي: 10 ثوانٍ
let remaining = 10;

const countdown = document.getElementById("countdown");

const timer = setInterval(function() {

remaining--;

countdown.textContent = remaining;

if (remaining <= 0) {

clearInterval(timer);

goToWhatsApp();

}

}, 1000);

</script>

</body>
</html>
