<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شكراً على تسجيلك | Offre Regional</title>

  <!-- Meta Pixel Code -->
  <script>
  !function(f,b,e,v,n,t,s)
  {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};
  if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
  n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];
  s.parentNode.insertBefore(t,s)}(window, document,'script',
  'https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', '1133091039167288');

  </script>
  <noscript>
    <img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1133091039167288&ev=PageView&noscript=1"/>
  </noscript>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;
      background: #f5f6f8;
      color: #171717;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      line-height: 1.7;
    }

    .thank-card {
      width: 100%;
      max-width: 560px;
      background: white;
      padding: 40px 30px;
      border-radius: 22px;
      text-align: center;
      border: 1px solid #eaeaea;
      box-shadow: 0 15px 50px rgba(0,0,0,.06);
    }

    .success-icon {
      width: 70px;
      height: 70px;
      background: #111;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 30px;
      margin: 0 auto 22px;
    }

    h1 {
      font-size: 29px;
      margin-bottom: 10px;
    }

    .description {
      color: #777;
      margin-bottom: 25px;
      font-size: 15px;
    }

    .details {
      background: #f7f7f7;
      border-radius: 13px;
      padding: 18px;
      text-align: right;
      margin-bottom: 25px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 8px 0;
      border-bottom: 1px solid #e8e8e8;
      font-size: 14px;
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-label {
      color: #777;
    }

    .detail-value {
      font-weight: bold;
      text-align: left;
      overflow-wrap: anywhere;
    }

    .whatsapp-button {
      display: block;
      width: 100%;
      padding: 16px;
      background: #111;
      color: white;
      border: none;
      border-radius: 11px;
      font-family: inherit;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      transition: .2s;
    }

    .whatsapp-button:hover {
      background: #333;
    }

    .note {
      color: #888;
      font-size: 12px;
      margin-top: 16px;
    }

    .missing {
      color: #b42318;
      margin-top: 20px;
      font-size: 14px;
    }

    @media (max-width: 480px) {
      .thank-card {
        padding: 30px 19px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <main class="thank-card">

    <div class="success-icon">✓</div>

    <h1>شكراً على تسجيلك!</h1>

    <p class="description">
      تم حفظ طلبك بنجاح. بقيت خطوة واحدة لإتمام التواصل معنا.
    </p>

    <section class="details" id="registrationDetails">
      <div class="detail-row">
        <span class="detail-label">الاسم الكامل</span>
        <span class="detail-value" id="customerName">—</span>
      </div>

      <div class="detail-row">
        <span class="detail-label">رقم الهاتف</span>
        <span class="detail-value" id="customerPhone">—</span>
      </div>

      <div class="detail-row">
        <span class="detail-label">الشعبة</span>
        <span class="detail-value" id="customerBranch">—</span>
      </div>

      <div class="detail-row">
        <span class="detail-label">العرض</span>
        <span class="detail-value">Offre Regional</span>
      </div>

      <div class="detail-row">
        <span class="detail-label">الثمن</span>
        <span class="detail-value">499 DH</span>
      </div>
    </section>

    <button class="whatsapp-button" id="whatsappButton" type="button">
      تأكيد التسجيل عبر WhatsApp
    </button>

    <p class="note">
      اضغط على الزر للتواصل معنا وإتمام الخطوات.
    </p>

    <p class="missing" id="missingMessage" style="display:none;">
      لم نعثر على بيانات التسجيل. المرجو العودة إلى صفحة التسجيل.
    </p>

  </main>

  <script>
    const WHATSAPP_NUMBER = "212663271459";

    const rawData = sessionStorage.getItem(
      "offreRegionalRegistration"
    );

    const button = document.getElementById("whatsappButton");
    const missingMessage = document.getElementById("missingMessage");

    let registration = null;

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, function(character) {
        const replacements = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        };

        return replacements[character];
      });
    }

    if (rawData) {
      try {
        registration = JSON.parse(rawData);

        document.getElementById("customerName").textContent =
          registration.name || "—";

        document.getElementById("customerPhone").textContent =
          registration.phone || "—";

        document.getElementById("customerBranch").textContent =
          registration.branch || "—";

      } catch (error) {
        console.error("Session data error:", error);
      }
    }

    if (!registration || !registration.id) {
      button.disabled = true;
      button.style.opacity = "0.5";
      missingMessage.style.display = "block";
    }

    button.addEventListener("click", function() {
      if (!registration || !registration.id) {
        return;
      }

      const message =
        "السلام عليكم، أؤكد تسجيلي في Offre Regional.\n\n" +
        "الاسم: " + registration.name + "\n" +
        "الهاتف: " + registration.phone + "\n" +
        "الشعبة: " + registration.branch + "\n" +
        "المستوى: " + registration.level + "\n" +
        "الثمن: " + registration.price + "\n" +
        "رقم التسجيل: " + registration.id;

      // Meta Pixel: Contact عند الضغط على واتساب
      if (typeof fbq === "function") {
        fbq("track", "Contact", {}, {
          eventID: registration.id + "_contact"
        });
      }

      const whatsappURL =
        "https://wa.me/" + WHATSAPP_NUMBER +
        "?text=" + encodeURIComponent(message);

      window.open(whatsappURL, "_blank");
    });
  </script>

</body>
</html>
